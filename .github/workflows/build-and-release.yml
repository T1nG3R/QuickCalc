name: Build & Release QuickCalc

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release (true/false)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p build-output
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with repository secret keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.keystore"
            KEYSTORE_FILE="${{ runner.temp }}/release.keystore" ./gradlew assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk build-output/QuickCalc.apk
          else
            echo "No keystore secret found, falling back to debug build..."
            ./gradlew assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk build-output/QuickCalc.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickCalc-APK
          path: build-output/QuickCalc.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: QuickCalc-APK
          path: ./release-artifacts

      - name: Prepare APK for Release
        run: |
          TAG_NAME="${{ github.ref_name }}"
          mv ./release-artifacts/QuickCalc.apk ./release-artifacts/QuickCalc-${TAG_NAME}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ./release-artifacts/QuickCalc-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
